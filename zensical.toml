[project]
site_name = "Stowmate"
site_url = "https://stowmate.dev"
site_description = "Dotfile manager powered by GNU Stow"
docs_dir = "docs"
repo_url = "https://github.com/olefSch/stowmate/tree/main"
repo_name = "olefSch/stowmate"

copyright = "Copyright &copy; 2026 Ole Schildt"

nav = [
  { "Home" = "index.md" },
  { "Introduction" = "introduction.md" },
  { "Commands" = [
    { "run" = "commands/run.md" },
    { "package" = "commands/package.md" },
    { "remove" = "commands/remove.md" },
  ] },
  { "Configuration" = "configuration.md" },
  { "Examples" = "examples.md" },
]

[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.footnotes]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.toc]
permalink = true

[project.theme]
variant = "modern"
language = "en"

features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "slate"
[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[project.theme.icon]
repo = "fontawesome/brands/git-alt"
